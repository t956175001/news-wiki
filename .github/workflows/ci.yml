name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend lint + tests
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_DB: newswiki
          POSTGRES_USER: newswiki
          POSTGRES_PASSWORD: newswiki
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DJANGO_ENV: dev
      # Throwaway values: this job never talks to a real LLM or a real host.
      SECRET_KEY: ci-only
      CRON_TOKEN: ci-only
      DATABASE_URL: postgres://newswiki:newswiki@localhost:5432/newswiki

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: pytest
        run: pytest -q

  frontend:
    name: frontend lint + type-check + test + build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: eslint
        run: npm run lint

      - name: vue-tsc
        run: npx vue-tsc --noEmit

      - name: vitest
        run: npm run test

      - name: build
        run: npm run build

  # A typo in the Caddyfile does not fail a build — it fails the running
  # container, and the site is down until someone notices. deploy.yml gates on
  # this workflow, so validating here is what keeps that from reaching prod.
  caddyfile:
    name: caddyfile validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: caddy validate
        run: |
          docker run --rm \
            -e SITE_DOMAIN=example.com \
            -e ADMIN_ALLOWED_IPS=192.0.2.1 \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  # Advisory only. There is one accepted-and-recorded finding right now
  # (GHSA-fgmj-fm8m-jvvx: ECharts is pinned to 5.x by CLAUDE.md's locked stack,
  # and the fix requires a major bump), so failing the build here would leave
  # CI permanently red and train everyone to ignore it.
  audit:
    name: dependency audit (advisory)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: pip-audit
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm audit
        continue-on-error: true
        working-directory: frontend
        run: npm audit --audit-level=high
