name: cron-daily

on:
  schedule:
    - cron: "0 0 * * *" # UTC 00:00 = 北京 08:00
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily pipeline
        run: |
          RESP=$(curl -sS -X POST \
            -H "X-Cron-Token: ${{ secrets.CRON_TOKEN }}" \
            https://${{ secrets.SITE_DOMAIN }}/api/v1/ops/cron/daily)
          echo "$RESP"
          echo "$RESP" | jq -e .run_id > /dev/null
