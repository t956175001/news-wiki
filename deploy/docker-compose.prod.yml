# Production stack. Static files are baked into the web image at build time
# (whitenoise serves them from inside the web container; Caddy only proxies
# /static/* to web, it never reads the files itself), so there is no shared
# static volume here — only frontend_dist, which Caddy DOES need to serve
# directly since it has no other way to reach the SPA build output.
#
# frontend_dist is a *named volume*, which Docker only seeds from the image
# the first time the volume is created — later deploys that ship a new image
# would otherwise keep serving whatever build first populated it. The web
# command below re-copies its baked ./frontend_dist_build into the volume on
# every start so it always matches the image that's actually running.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ../.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - frontend_dist:/app/frontend_dist
    # All continuation lines below are kept at this same indentation on
    # purpose: a YAML folded (>) scalar only joins lines with newline->space
    # when their indentation matches the first line. Extra indentation (e.g.
    # to visually align the gunicorn flags) makes YAML preserve a literal
    # newline instead, which turns "--bind ..." into an unreached, separate
    # shell statement and silently leaves gunicorn on its 127.0.0.1 default.
    command: >
      sh -c "rm -rf /app/frontend_dist/* &&
      cp -r /app/frontend_dist_build/. /app/frontend_dist/ &&
      python manage.py migrate --noinput &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000
      --workers 3 --threads 2 --timeout 120
      --access-logfile - --error-logfile -"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - frontend_dist:/srv/frontend:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    depends_on:
      - web

volumes:
  pgdata:
  frontend_dist:
  caddy_data:
  caddy_config:
  caddy_logs:
